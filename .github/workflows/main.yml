name: eSearcher

on:
  # push:
  #   branches:
  #     - main
  #     - development
  schedule:
  #  - cron: '*/15 * * * *' # Uncomment cron part to run it every 15 minutes

env:
  API_KEY: ${{ secrets.API_KEY }}
  SEARCH_ENGINE_ID: ${{ secrets.SEARCH_ENGINE_ID }}
  NUMBER_OF_QUERIES: 2  # Set this to the number of folders with numbers (0,1,2,...) in eSearcher/data directory (for example, if there is only folder 0, set this as 1 (one folder))

jobs:
  e_searching:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      # 🔧 GLOBAL ROBOT IDENTITY + NOTES INITIALIZATION
      - name: 🤖 Initialize Robot Identity & Notes
        run: |
          git config --global user.name "Automation Engine"
          git config --global user.email "automation@yourdomain"
          git config --global notes.rewriteRef "refs/notes/*"

      - name: Set up Python 3
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: python -m unittest discover -s tests

      - name: Set run number
        run: echo "GITHUB_RUN_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Run eSearcher
        run: python main.py

      - name: Commit and push changes
        run: |
          git add data/data.json information.html data/*/none_words.txt

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🤖 robot: update data.json, information.html, none_words.txt | run $GITHUB_RUN_NUMBER"
            git notes add -m "robot: true"
            git push origin "${{ github.ref }}"
            git push origin refs/notes/* || true
          fi